name: Repository files and documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-files:
    name: Repository structure and public-file checks (not product tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Inspect repository files and documentation only
        run: python3 scripts/check_repository.py
